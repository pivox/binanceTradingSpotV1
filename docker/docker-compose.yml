version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tradebot
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tradebot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
