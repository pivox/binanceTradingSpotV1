[tool.poetry]
name = "tradebot"
version = "0.1.0"
description = "Spot trading bot architecture scaffold"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "tradebot", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"
pydantic-settings = "^2.2"
pyyaml = "^6.0"
sqlalchemy = "^2.0"
alembic = "^1.13"
temporalio = "^1.5"
aiohttp = "^3.9"
websockets = "^12.0"
asyncpg = "^0.29"
tenacity = "^8.2"
python-dotenv = "^1.0"
prometheus-client = "^0.20"
structlog = "^24.1"
psycopg = {extras = ["binary"], version = "^3.3.2"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
ruff = "^0.4"
mypy = "^1.9"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml", "asyncpg"]
ignore_missing_imports = true
